<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Syrian Military Supply — genuine military surplus, tactical gear and local crafts." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Syrian Military Supply</title>
    <script>
      // Apply the stored language (default: Arabic) before first paint so there
      // is no flash of the wrong language/direction.
      (function () {
        try {
          var stored = localStorage.getItem('sms_lang');
          var lang = stored === 'en' || stored === 'ar' ? stored : 'ar';
          var root = document.documentElement;
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          root.classList.toggle('rtl', lang === 'ar');
          root.classList.toggle('ltr', lang === 'en');
        } catch (e) {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
